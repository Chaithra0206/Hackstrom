<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Stylized geometric portrait illustration">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6c6a5" />
      <stop offset="100%" stop-color="#e5a982" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="640" fill="url(#bgGrad)" />

  <!-- Subtle geometric backdrop accents -->
  <circle cx="510" cy="130" r="140" fill="url(#orbGrad)" />
  <circle cx="120" cy="520" r="160" fill="url(#orbGrad)" />
  <polygon points="60,90 140,60 110,145" fill="#38bdf8" fill-opacity="0.12" />
  <rect x="470" y="450" width="90" height="90" rx="18" transform="rotate(18 515 495)" fill="#818cf8" fill-opacity="0.12" />

  <!-- Soft frame ring -->
  <circle cx="320" cy="320" r="230" fill="#0f172a" fill-opacity="0.35" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" />

  <!-- Shoulders / Torso -->
  <path d="M165 550 C175 445, 240 410, 320 410 C400 410, 465 445, 475 550 Z" fill="url(#shirtGrad)" />
  <!-- Collar geometric detail -->
  <polygon points="275,415 320,468 365,415" fill="#e0f2fe" />
  <polygon points="295,415 320,450 345,415" fill="#0f172a" fill-opacity="0.15" />

  <!-- Neck -->
  <rect x="288" y="348" width="64" height="72" rx="22" fill="#dfa077" />

  <!-- Hair Back -->
  <path d="M210 250 C205 155, 260 115, 320 115 C380 115, 435 155, 430 250 L442 350 C442 385, 410 405, 385 395 L255 395 C230 405, 198 385, 198 350 Z" fill="url(#hairGrad)" />

  <!-- Ears -->
  <circle cx="226" cy="272" r="20" fill="#e5a982" />
  <circle cx="414" cy="272" r="20" fill="#e5a982" />

  <!-- Face -->
  <rect x="232" y="166" width="176" height="206" rx="84" fill="url(#skinGrad)" />

  <!-- Hair Front / Bangs -->
  <path d="M225 225 C228 155, 275 128, 325 128 C378 128, 415 162, 415 222 C388 186, 355 178, 320 192 C288 175, 250 185, 225 225 Z" fill="url(#hairGrad)" />

  <!-- Eyebrows -->
  <path d="M262 238 Q280 230 298 237" fill="none" stroke="#1e1b4b" stroke-width="5" stroke-linecap="round" />
  <path d="M342 237 Q360 230 378 238" fill="none" stroke="#1e1b4b" stroke-width="5" stroke-linecap="round" />

  <!-- Eyes -->
  <circle cx="280" cy="260" r="10" fill="#0f172a" />
  <circle cx="360" cy="260" r="10" fill="#0f172a" />
  <circle cx="283" cy="256" r="3" fill="#ffffff" />
  <circle cx="363" cy="256" r="3" fill="#ffffff" />

  <!-- Nose -->
  <path d="M320 262 L314 294 L326 297" fill="none" stroke="#c8835b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cheeks -->
  <ellipse cx="262" cy="292" rx="14" ry="8" fill="#fb7185" fill-opacity="0.22" />
  <ellipse cx="378" cy="292" rx="14" ry="8" fill="#fb7185" fill-opacity="0.22" />

  <!-- Smile -->
  <path d="M294 318 Q320 338 346 318" fill="none" stroke="#9a3412" stroke-width="5" stroke-linecap="round" />

  <!-- Glasses (subtle geometric touch) -->
  <rect x="252" y="242" width="56" height="36" rx="12" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.7" />
  <rect x="332" y="242" width="56" height="36" rx="12" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.7" />
  <line x1="308" y1="258" x2="332" y2="258" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.7" />
</svg>

